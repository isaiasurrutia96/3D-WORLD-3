# Builds the two independent games and publishes them at separate URLs.
#
# Once this has run, the game is a web page that can simply be reloaded —
# no checkout, no install, no local server.
#
# This needs Pages switched on for the repository first:
#   Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy to GitHub Pages

# Only from the default branch. Pages will not publish from any other, so a
# run on the working branch could never do anything but fail — and because
# every deploy shares one queue, those doomed runs sat in front of the real
# one and held it up. Work is pushed to the branch and then fast-forwarded
# into main, so main always has it.
on:
  push:
    branches:
      - main
  # Also allows publishing by hand from the Actions tab.
  workflow_dispatch:

# Read the repository, and mint the token Pages needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and the newest wins. Waiting instead of
# superseding meant a backlog could only ever grow: four runs queued behind
# each other, each publishing a version already out of date by the time it
# got its turn. Nothing is published until the very last step, so a cancelled
# run leaves the live site exactly as it was.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/letsgo-racing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install racing dependencies
        run: npm ci --prefix apps/letsgo-racing

      - name: Check racing behavior
        run: npm run test:racing

      - name: Check types and build both independent sites
        run: npm run build:all

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
