# Companion games share a site with a separately published main world.
# Always retain that current root publication, even when it is ahead of main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-companions
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .published-site
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check whether companion routes need restoring
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node tools/publish-companions.mjs --plan
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.revision }}
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .published-site
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/letsgo-racing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install racing dependencies
        run: npm ci --prefix apps/letsgo-racing
      - name: Check publishing boundaries
        run: npm run test:pages
      - name: Check racing behavior
        run: npm run test:racing
      - name: Check island terrain
        run: npm run test:island
      - name: Check independent garden
        run: npm run test:garden
      - name: Check types and build independent sites
        run: npm run build:all
      - name: Publish companion routes without replacing the main world
        run: node tools/publish-companions.mjs --push
      - name: Detect the configured Pages publisher
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages(context.repo);
            if (!['legacy', 'workflow'].includes(data.build_type)) {
              throw new Error(`Unknown Pages build type: ${data.build_type}`);
            }
            if (data.build_type === 'legacy' && data.source?.branch !== 'gh-pages') {
              throw new Error('Branch publishing must use gh-pages; no Pages settings were changed.');
            }
            core.setOutput('mode', data.build_type);
      # GITHUB_TOKEN pushes do not start Pages builds; request one explicitly.
      - name: Request publication of the repaired gh-pages branch
        if: steps.pages.outputs.mode == 'legacy'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.requestPagesBuild(context.repo);
      - name: Configure Pages
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5
      - name: Upload the complete preserved site
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .published-site

  deploy:
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
