<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080e25" />
    <title>LetsGo · Floor</title>
  </head>
  <body>
    <div id="app">
      <canvas aria-label="One plain gray avatar walking with E/D/S/F and sprinting with Shift plus any movement key on a charcoal slab connected to a floating circuit. Space jumps. Drag to rotate the view; scroll or pinch to zoom." tabindex="0"></canvas>
      <header><a class="brand" href="./">LetsGo<span>®</span></a></header>
      <aside class="key-chart" aria-label="Control chart">
        <div class="movement-keys">
          <span><kbd>E</kbd>Walk forward</span>
          <span><kbd>D</kbd>Walk backward</span>
          <span><kbd>S</kbd>Walk left</span>
          <span><kbd>F</kbd>Walk right</span>
          <span aria-label="Hold Shift with E, D, S or F to sprint"><kbd>SHIFT</kbd> + move Sprint</span>
          <span><kbd>SPACE</kbd>Jump</span>
        </div>
        <div class="camera-keys"><span id="camera-hint">Drag to rotate · Scroll / pinch to zoom</span><span><kbd>L</kbd>Mouse lock <kbd>ESC</kbd>Release <kbd>R</kbd>Reset view</span></div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
