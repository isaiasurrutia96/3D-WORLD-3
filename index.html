<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080e25" />
    <title>LetsGo · Time trial</title>
  </head>
  <body>
    <div id="app">
      <canvas aria-label="Plain gray avatar running with E/D/S/F and walking while Shift is held on a charcoal slab connected to a floating circuit. Space jumps; Q plus Space performs a standing backflip. Drag to rotate the view; scroll or pinch to zoom." tabindex="0"></canvas>
      <header><a class="brand" href="./">LetsGo<span>®</span></a></header>
      <section class="trial-panel" aria-label="Time trial">
        <div class="trial-heading"><span>TIME TRIAL</span><span id="trial-lap">Lap 1</span></div>
        <output id="trial-time" aria-label="Current lap time" aria-live="off">00:00.000</output>
        <div class="trial-best">BEST <output id="trial-best" aria-label="Best lap time">--:--.---</output></div>
        <div id="trial-last"></div>
        <button id="trial-start" type="button">Start in kart · T</button>
        <label class="ghost-control"><input id="trial-ghost" type="checkbox" checked disabled> Best ghost</label>
        <p id="trial-status" role="status">Complete a lap to record your ghost</p>
      </section>
      <aside class="key-chart" aria-label="Control chart">
        <div class="movement-keys">
          <span><kbd>E</kbd>Run forward</span>
          <span><kbd>D</kbd>Run backward</span>
          <span><kbd>S</kbd>Run left</span>
          <span><kbd>F</kbd>Run right</span>
          <span aria-label="Hold Shift with E, D, S or F to walk"><kbd>SHIFT</kbd> + move Walk</span>
          <span><kbd>SPACE</kbd>Jump</span>
          <span><kbd>Q</kbd>+<kbd>SPACE</kbd>Standing backflip</span>
          <span><kbd>H</kbd><span id="kart-action">Enter kart</span></span>
        </div>
        <div class="camera-keys"><button id="view-toggle" type="button" aria-label="Toggle isometric and third-person camera">V Isometric</button><span id="camera-hint">Drag to rotate · Scroll / pinch to zoom</span><span><kbd>L</kbd>Mouse lock <kbd>ESC</kbd>Release <kbd>R</kbd>Reset view</span></div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
