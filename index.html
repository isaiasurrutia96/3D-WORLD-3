<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover puts the canvas under the notch and the home bar, and
      the safe-area insets in the stylesheet keep the controls out from under
      them. user-scalable=no is what stops a pinch or a double tap zooming the
      game instead of playing it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1626" />
    <title>LetsGo</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <!--
        Shown until the first frame is drawn. The island takes a few seconds to
        build on an older machine, and a page that is dark and says nothing for
        that long looks exactly like a page that is broken. If something does
        break, what broke is written here instead of nothing.
      -->
      <p
        id="boot"
        style="position:fixed;inset:0;margin:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:600 18px/1.4 system-ui,sans-serif;color:#cfe3f7;white-space:pre-wrap;z-index:5"
      >Building the island…</p>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var boot = document.getElementById('boot');
        if (boot) {
          boot.textContent =
            'Something went wrong starting the game:\n\n' +
            (event.message || 'unknown error') +
            (event.filename ? '\n' + event.filename + ':' + event.lineno : '');
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var boot = document.getElementById('boot');
        if (boot) boot.textContent = 'Something went wrong starting the game:\n\n' + String(event.reason);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
